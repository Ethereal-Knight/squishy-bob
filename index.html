<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squishy Bob's Neon Escape - Glitch & Intro Edition</title>
    <link rel="stylesheet" href="./css/game.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="main-menu">
            <h1>SQUISHY BOB</h1>
            <h2>Cyber Maze & Glitch Security</h2>
            <button id="campaign-button" class="menu-btn">Campaign (Maze & Patrols)</button>
            <button id="endless-button" class="menu-btn">Endless Cyber Run</button>
            <button id="achievements-button" class="menu-btn">Trophies & Stats</button>
        </div>
    </div>
    <div class="controls">
        Move: <kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> | Jump / Double Jump: <kbd>Space</kbd> / <kbd>W</kbd> / <kbd>↑</kbd> | Squish Flat: <kbd>S</kbd> / <kbd>↓</kbd> | Menu: <kbd>M</kbd>
    </div>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
