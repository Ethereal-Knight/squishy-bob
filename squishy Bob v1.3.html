<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squishy Bob's Neon Escape - The Warden Protocol</title>
    <style>
        body {
            margin: 0; 
            padding: 0; 
            background-color: #050510; 
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: center; 
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: min(800px, calc(100vw - 24px));
            aspect-ratio: 8 / 5;
        }

        canvas { 
            display: block;
            width: 100%;
            height: auto;
            box-sizing: border-box;
            background-color: #080816; 
            border: 4px solid #0ff; 
            border-radius: 8px; 
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4); 
        }
        
        #main-menu {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(8, 8, 20, 0.95); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            border-radius: 8px; 
            z-index: 10;
        }

        #main-menu h1 { 
            color: #fff; 
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff; 
            font-size: clamp(26px, 8vw, 44px);
            margin: 0; 
            letter-spacing: 2px;
        }

        #main-menu h2 { 
            color: #ff00ff; 
            text-shadow: 0 0 8px #ff00ff, 0 0 15px #ff00ff; 
            margin-top: 5px; 
            margin-bottom: 20px;
            font-size: clamp(10px, 2.5vw, 16px);
            letter-spacing: 1px;
            text-align: center;
            padding: 0 12px;
        }

        .menu-btn { 
            margin-top: 10px; 
            padding: 12px 35px; 
            font-size: 15px; 
            font-family: inherit;
            font-weight: bold;
            background: rgba(0, 255, 255, 0.05); 
            color: #0ff; 
            border: 2px solid #0ff; 
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5); 
            cursor: pointer; 
            transition: all 0.2s ease-in-out;
            width: min(320px, calc(100% - 40px));
            text-transform: uppercase;
            border-radius: 4px;
        }

        .menu-btn:hover { 
            background: #0ff; 
            color: #000; 
            box-shadow: 0 0 20px #0ff;
            transform: scale(1.03);
        }

        .controls { 
            margin-top: 12px; 
            color: #0ff; 
            font-size: 13px; 
            text-shadow: 0 0 5px #0ff; 
            text-align: center;
        }

        kbd { 
            background: #111; 
            padding: 3px 6px; 
            border-radius: 4px; 
            color: #ff00ff; 
            font-weight: bold; 
            border: 1px solid #ff00ff; 
            box-shadow: 0 0 5px rgba(255, 0, 255, 0.5);
        }

        .controls {
            max-width: calc(100vw - 24px);
            line-height: 2;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div id="main-menu">
            <h1>SQUISHY BOB</h1>
            <h2>THE WARDEN PROTOCOL: 30 SECTORS + FINAL BOSS</h2>
            <button class="menu-btn" onclick="startCampaignWithIntro()">Begin Story Campaign</button>
            <button class="menu-btn" onclick="startGame('ENDLESS')">Endless Cyber Run</button>
            <button class="menu-btn" onclick="showAchievements()">Trophies & Stats</button>
        </div>
    </div>
    
    <div class="controls">
        Move: <kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> | Jump / Double Jump: <kbd>Space</kbd> / <kbd>W</kbd> / <kbd>↑</kbd> | Squish Flat: <kbd>S</kbd> / <kbd>↓</kbd> | Menu: <kbd>M</kbd>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const menuDiv = document.getElementById("main-menu");

        let gameState = "MENU"; 
        let currentLevel = 0;
        let endlessDistance = 0;
        let endlessSpeed = 3.5;
        
        let introTimer = 0;
        const introMaxTimer = 220;
        let introTextIndex = 0;
        const introMessages = [
            "> BOBSHELL MAINTENANCE GEL: ONLINE.",
            "> THE GLITCH WARDEN HAS LOCKED THE NEON GRID.",
            "> 29 SECTORS CORRUPTED. CREW SIGNALS: TRAPPED.",
            "> REBOOT THE CORE. FREE THE CREW. STOP THE WARDEN.",
            "> SQUISH ENGINE ENGAGED. LET'S GET EVERYONE HOME!"
        ];

        const keys = { w: false, a: false, s: false, d: false, space: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        let spaceWasPressed = false;
        let upWasPressed = false;

        window.addEventListener("keydown", (e) => {
            let k = e.key.toLowerCase();
            if ((gameState === "CAMPAIGN" || gameState === "ENDLESS") &&
                ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
                e.preventDefault();
            }
            if (k === "w") keys.w = true; 
            if (k === "a") keys.a = true;
            if (k === "s") keys.s = true; 
            if (k === "d") keys.d = true;
            if (e.key === " ") { keys.space = true; e.preventDefault(); }
            if (e.key === "ArrowUp") keys.ArrowUp = true;
            if (e.key === "ArrowDown") keys.ArrowDown = true;
            if (e.key === "ArrowLeft") keys.ArrowLeft = true;
            if (e.key === "ArrowRight") keys.ArrowRight = true;

            if (k === "m") { 
                gameState = "MENU"; 
                menuDiv.style.display = "flex"; 
                resetPlayer(); 
            }

            if (gameState === "ACHIEVEMENTS" || gameState === "CAMPAIGN_WIN" || gameState === "ENDLESS_OVER") {
                if (e.key === " ") {
                    gameState = "MENU";
                    menuDiv.style.display = "flex";
                }
            }
        });

        window.addEventListener("keyup", (e) => {
            let k = e.key.toLowerCase();
            if (k === "w") keys.w = false; 
            if (k === "a") keys.a = false;
            if (k === "s") keys.s = false; 
            if (k === "d") keys.d = false;
            if (e.key === " ") keys.space = false;
            if (e.key === "ArrowUp") keys.ArrowUp = false;
            if (e.key === "ArrowDown") keys.ArrowDown = false;
            if (e.key === "ArrowLeft") keys.ArrowLeft = false;
            if (e.key === "ArrowRight") keys.ArrowRight = false;
        });

        let player = { 
            x: 50, y: 400, 
            baseW: 26, baseH: 26,
            w: 26, h: 26, 
            renderW: 26, renderH: 26,
            vx: 0, vy: 0, 
            speed: 6.2, jumpPower: 12.2,
            gravity: 0.58, friction: 0.82, 
            grounded: false,
            standingOn: null,
            coyoteTimer: 0,
            jumpsLeft: 2,
            isSquishingFlat: false,
            flipAngle: 0,
            isFlipping: false,
            blinkTimer: 100,
            isBlinking: false
        };
        
        let camera = { x: 0, y: 0 };

        let platforms = []; 
        let movingPlatforms = [];
        let lavas = []; 
        let enemies = [];
        let boss = null;
        let bossProjectiles = [];
        let bossAttackTimer = 0;
        let goal = { x: 0, y: 0, w: 40, h: 40 };
        let particles = []; 
        let energyBits = [];
        
        let stats = { deaths: 0, maxLevel: 0, highEndless: 0, bitsCollected: 0, flips: 0, flatSquishes: 0 };
        const achievements = [
            { id: "first", name: "System Boot", desc: "Beat Level 1", unlocked: false },
            { id: "maze", name: "Maze Navigator", desc: "Complete sector 18: Laserless Labyrinth", unlocked: false },
            { id: "master", name: "Master Escapist", desc: "Conquer all levels!", unlocked: false },
            { id: "flip", name: "Acrobatic Gel", desc: "Perform 20 double jump flips", unlocked: false },
            { id: "pancake", name: "Pancake Bob", desc: "Squish flat 20 times", unlocked: false },
            { id: "runner", name: "Cyber Sprinter", desc: "Reach 1000m in Endless Mode", unlocked: false },
            { id: "clumsy", name: "Glitchy Drops", desc: "Die 5 times", unlocked: false },
            { id: "hoarder", name: "Byte Collector", desc: "Collect 10 energy bits", unlocked: false }
        ];
        let toasts = [];

        function unlockAchievement(id) {
            let ach = achievements.find(a => a.id === id);
            if (ach && !ach.unlocked) {
                ach.unlocked = true;
                toasts.push({ 
                    text: "🏆 UNLOCKED: " + ach.name, 
                    timer: 220, 
                    maxTimer: 220,
                    animY: -50,
                    targetY: 0,
                    alpha: 0
                });
            }
        }

        function buildSector(spec, index) {
            const width = 1260;
            const floorY = 450;
            const pits = spec.pits || [];
            const floor = [];
            let cursor = 0;
            for (const [x, w] of pits) {
                if (x > cursor) floor.push([cursor, floorY, x - cursor, 50]);
                cursor = x + w;
            }
            if (cursor < width) floor.push([cursor, floorY, width - cursor, 50]);

            const platforms = floor.slice();
            for (const [x, y, w] of (spec.ledges || [])) platforms.push([x, y, w, 16]);
            for (const [x, w] of (spec.ducts || [])) platforms.push([x, 414, w, 20]);

            const lava = pits.map(([x, w]) => [x, 480, w, 20]);
            const enemies = (spec.patrols || []).map(([x, minX, maxX, speed]) => ({
                x, y: floorY - 26, w: 26, h: 26, vx: speed, vy: 0,
                minX, maxX, minY: 0, maxY: 0
            }));
            const moving = (spec.lifts || []).map(([x, y, w, minX, maxX, speed]) => ({
                x, y, w, h: 18, vx: speed, vy: 0, minX, maxX, minY: 0, maxY: 0
            }));
            return {
                t: `${index + 1}: ${spec.name}`,
                m: spec.desc,
                completionAchievement: spec.completionAchievement,
                p: platforms,
                mp: moving,
                l: lava,
                e: enemies,
                g: [1190, 400],
                s: [50, 400]
            };
        }

        const sectorSpecs = [
            ["Boot Sequence", "A clear runway. Learn the rhythm of a jump and a double-jump.", [], [], [], [], [], "first"],
            ["First Firewall", "Short plasma gaps introduce safe, readable jump timing.", [[340, 72]], [], [], [], []],
            ["Patrol Sweep", "Watch the patrol's route, then hop past it.", [], [], [], [[560, 440, 790, 1.7]], []],
            ["Split Circuit", "Two narrow gaps. Keep your momentum and land cleanly.", [[330, 80], [770, 88]], [], [], [], []],
            ["Low-Ceiling Link", "Hold DOWN / S to squish through the low neon duct.", [], [[350, 250]], [], [], []],
            ["Crossfire Hall", "A patrol guards the exit beyond a broad plasma seam.", [[610, 108]], [], [], [[840, 730, 1040, 2]], []],
            ["Stepping Stones", "Raised ledges give you a safer route across the floor.", [[430, 86]], [], [[330, 338, 130], [590, 365, 130]], [], []],
            ["Duct and Drop", "Crawl under the beam, then jump the gap just beyond it.", [[650, 78]], [[340, 245]], [], [], []],
            ["Lift-Off", "Ride the moving bridge over plasma and jump for the far bank.", [[475, 170]], [], [], [], [[390, 365, 110, 345, 550, 1.5]]],
            ["Hot Zigzag", "Three compact gaps make this a test of steady landings.", [[290, 70], [610, 78], [940, 86]], [], [], [], []],
            ["Security Tunnel", "Squish beneath the security beam while a patrol closes in.", [], [[390, 300]], [], [[760, 670, 950, 2.1]], []],
            ["Double Lift", "Chain two moving bridges. Wait for each one to come back.", [[360, 170], [800, 160]], [], [], [], [[300, 350, 105, 260, 455, 1.7], [730, 355, 105, 680, 875, -1.8]]],
            ["Glitch Garden", "Ledges, plasma and a roaming glitch share the same lane.", [[680, 100]], [], [[420, 360, 125], [790, 340, 145]], [[930, 850, 1080, -2.2]], []],
            ["Vertical Exchange", "Climb the stepping ledges, then drop back to the exit lane.", [[500, 90]], [], [[310, 362, 125], [535, 325, 125], [770, 360, 125]], [], []],
            ["Pressure Valve", "Cross a narrow gap, then duck through a second low duct.", [[360, 96]], [[760, 220]], [], [[1010, 910, 1130, 2.3]], []],
            ["Moving Crossroads", "A broad lift and two patrols demand patient timing.", [[460, 165]], [], [], [[260, 190, 335, 2.2], [1000, 920, 1120, -2.4]], [[385, 370, 120, 340, 565, 1.9]]],
            ["Three-Beat Circuit", "Three gaps arrive in a steady rhythm. Keep your double jump ready.", [[260, 76], [610, 86], [950, 94]], [], [], [[760, 670, 850, 2.4]], []],
            ["Laserless Labyrinth", "A low route and raised bypass meet at a guarded landing.", [[720, 100]], [[310, 250]], [[590, 345, 140], [850, 320, 150]], [[1010, 940, 1150, -2.5]], [], "maze"],
            ["Shifting Foundry", "Two lifts cross the foundry while glitches patrol the banks.", [[400, 150], [870, 155]], [], [], [[610, 520, 700, -2.4]], [[330, 365, 115, 285, 485, 2], [800, 360, 115, 755, 955, -2]]],
            ["Coreward Climb", "Use the high route over a hot gap; the far landing is guarded.", [[490, 105]], [], [[300, 365, 130], [530, 320, 130], [760, 350, 150]], [[1010, 900, 1140, 2.6]], []],
            ["Narrowband", "A long duct crawl feeds directly into a moving bridge.", [[760, 150]], [[270, 270]], [], [], [[680, 360, 110, 635, 840, 2.1]]],
            ["Patrol Gauntlet", "Three patrols overlap. Use the ledges to choose your moment.", [[520, 95]], [], [[365, 360, 120], [690, 335, 130]], [[300, 210, 390, 2.5], [780, 690, 870, -2.7], [1080, 1000, 1170, 2.4]], []],
            ["Twin Foundry Lifts", "Bridge the wide plasma cuts with two moving lifts.", [[330, 145], [850, 155]], [], [], [[590, 500, 680, 2.6]], [[270, 365, 115, 235, 425, 2.2], [790, 365, 115, 740, 930, -2.3]]],
            ["Warden's Outer Ring", "The last approach mixes a duct, two gaps and a fast patrol.", [[420, 88], [870, 110]], [[650, 215]], [[485, 350, 130]], [[1050, 950, 1180, 2.8]], []],
            ["Signal Scrambler", "Take the upper ledges past two glitches and a moving bridge.", [[600, 155]], [], [[320, 360, 135], [570, 325, 140], [840, 350, 145]], [[460, 400, 610, 2.6], [1010, 940, 1160, -2.8]], [[550, 365, 115, 510, 705, 2.4]]],
            ["Redline Relay", "Fast patrols guard a staircase of safe landings.", [[320, 80], [730, 95]], [], [[450, 350, 120], [820, 320, 130]], [[570, 500, 700, -2.8], [1040, 960, 1170, 3]], []],
            ["Final Approach", "A long plasma break, two lifts and a tight security duct.", [[430, 175], [950, 105]], [[690, 220]], [], [[250, 180, 330, 2.8], [1090, 1000, 1190, -3]], [[365, 365, 115, 320, 510, 2.5], [900, 365, 100, 845, 1015, -2.4]]],
            ["Core Lockdown", "The Warden's guards cover every landing. Stay sharp.", [[300, 82], [620, 92], [940, 100]], [], [[430, 350, 120], [760, 330, 140]], [[535, 470, 690, 3], [1080, 995, 1195, -3.1]], []],
            ["Warden's Gate", "One last gauntlet before the core. Save your jumps for the lifts.", [[360, 145], [800, 150]], [[610, 245]], [[480, 350, 125], [870, 325, 135]], [[250, 180, 325, 3], [1050, 960, 1180, -3.2]], [[305, 365, 110, 265, 455, 2.6], [750, 365, 110, 710, 895, -2.7]]]
        ].map((entry, index) => buildSector({
            name: entry[0], desc: entry[1], pits: entry[2], ducts: entry[3],
            ledges: entry[4], patrols: entry[5], lifts: entry[6], completionAchievement: entry[7]
        }, index));

        const levels = [
            ...sectorSpecs,
            {
                t: "30: The Glitch Warden",
                m: "Stomp the Warden from above. Dodge its neon bolts and survive seven hits!",
                p: [[0, 450, 1000, 50], [0, 0, 24, 500], [976, 0, 24, 500]],
                mp: [], l: [], e: [], g: [920, 400], s: [70, 400],
                boss: { x: 590, y: 365, w: 92, h: 85, vx: 2.1, minX: 350, maxX: 760, hp: 7, maxHp: 7 }
            }
        ];

        function startCampaignWithIntro() {
            menuDiv.style.display = "none";
            gameState = "INTRO";
            introTimer = 0;
            introTextIndex = 0;
            currentLevel = 0;
        }

        function startGame(mode) {
            menuDiv.style.display = "none";
            gameState = mode;
            if (mode === "CAMPAIGN") {
                currentLevel = 0;
                loadLevel();
            } else if (mode === "ENDLESS") {
                startEndless();
            }
        }

        function showAchievements() {
            menuDiv.style.display = "none";
            gameState = "ACHIEVEMENTS";
        }

        function resetPlayer() {
            player.vx = 0; 
            player.vy = 0;
            player.w = player.baseW;
            player.h = player.baseH;
            player.renderW = player.baseW;
            player.renderH = player.baseH;
            player.jumpsLeft = 2;
            player.isSquishingFlat = false;
            player.isFlipping = false;
            player.flipAngle = 0;
            player.coyoteTimer = 0;
            player.standingOn = null;
        }

        function createDeathExplosion(x, y) {
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x + player.w / 2,
                    y: y + player.h / 2,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.5) * 14,
                    size: Math.random() * 7 + 3,
                    color: Math.random() > 0.5 ? "#00f0ff" : "#ff00ff",
                    alpha: 1
                });
            }
        }

        function createJumpBurst(x, y) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: Math.random() * 4 + 2,
                    size: Math.random() * 5 + 2,
                    color: "#00f0ff",
                    alpha: 0.8
                });
            }
        }

        function loadLevel() {
            let lvl = levels[currentLevel];
            platforms = lvl.p.map(arr => ({x: arr[0], y: arr[1], w: arr[2], h: arr[3]}));
            
            movingPlatforms = lvl.mp.map(o => ({
                x: o.x, y: o.y, w: o.w, h: o.h, 
                vx: o.vx, vy: o.vy, 
                minX: o.minX, maxX: o.maxX, minY: o.minY, maxY: o.maxY 
            }));

            lavas = lvl.l.map(arr => ({x: arr[0], y: arr[1], w: arr[2], h: arr[3]}));
            
            enemies = lvl.e.map(o => ({
                x: o.x, y: o.y, w: o.w, h: o.h,
                vx: o.vx, vy: o.vy,
                minX: o.minX, maxX: o.maxX, minY: o.minY, maxY: o.maxY
            }));

            goal = {x: lvl.g[0], y: lvl.g[1], w: 40, h: 40};
            boss = lvl.boss ? { ...lvl.boss } : null;
            bossProjectiles = [];
            bossAttackTimer = 75;
            player.x = lvl.s[0]; 
            player.y = lvl.s[1];
            energyBits = [];
            resetPlayer();

            stats.maxLevel = Math.max(stats.maxLevel, currentLevel + 1);
        }

        function die() {
            createDeathExplosion(player.x, player.y);
            stats.deaths++;
            if (stats.deaths >= 5) unlockAchievement("clumsy");

            if (gameState === "CAMPAIGN") {
                loadLevel();
            } else if (gameState === "ENDLESS") {
                if (endlessDistance > stats.highEndless) stats.highEndless = endlessDistance;
                gameState = "ENDLESS_OVER";
            }
        }

        function startEndless() {
            endlessDistance = 0; 
            endlessSpeed = 3.5;
            platforms = [{x: 0, y: 400, w: 800, h: 100}]; 
            movingPlatforms = [];
            lavas = [];
            enemies = [];
            energyBits = [];
            boss = null;
            bossProjectiles = [];
            bossAttackTimer = 0;
            player.x = 100; 
            player.y = 300; 
            resetPlayer();
        }

        function checkCollisionAt(x, y, w, h) {
            let allP = platforms.concat(movingPlatforms);
            for (let p of allP) {
                if (x < p.x + p.w && x + w > p.x &&
                    y < p.y + p.h && y + h > p.y) {
                    return true;
                }
            }
            return false;
        }

        function update() {
            for (let i = toasts.length - 1; i >= 0; i--) {
                let t = toasts[i];
                t.timer--;

                let targetY = i * 48;
                if (t.timer > t.maxTimer - 25) {
                    t.alpha += (1 - t.alpha) * 0.2;
                    t.animY += (targetY - t.animY) * 0.2;
                } else if (t.timer < 30) {
                    t.alpha += (0 - t.alpha) * 0.2;
                    t.animY -= 1.5;
                } else {
                    t.alpha = 1;
                    t.animY += (targetY - t.animY) * 0.2;
                }

                if (t.timer <= 0) toasts.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= 0.03;
                if (pt.alpha <= 0) particles.splice(i, 1);
            }

            if (gameState === "INTRO") {
                introTimer++;
                if (introTimer % 38 === 0 && introTextIndex < introMessages.length - 1) {
                    introTextIndex++;
                }
                if (introTimer >= introMaxTimer) {
                    gameState = "CAMPAIGN";
                    loadLevel();
                }
                return;
            }

            if (gameState !== "CAMPAIGN" && gameState !== "ENDLESS") return;

            for (let mp of movingPlatforms) {
                mp.x += mp.vx;
                mp.y += mp.vy;

                if (mp.vx > 0 && mp.x >= mp.maxX) mp.vx *= -1;
                if (mp.vx < 0 && mp.x <= mp.minX) mp.vx *= -1;
                if (mp.vy > 0 && mp.y >= mp.maxY) mp.vy *= -1;
                if (mp.vy < 0 && mp.y <= mp.minY) mp.vy *= -1;

                if (player.grounded && player.standingOn === mp) {
                    player.x += mp.vx;
                    player.y += mp.vy;
                }
            }

            for (let e of enemies) {
                e.x += e.vx;
                e.y += e.vy;

                if (e.vx > 0 && e.x >= e.maxX) e.vx *= -1;
                if (e.vx < 0 && e.x <= e.minX) e.vx *= -1;
                if (e.vy > 0 && e.y >= e.maxY) e.vy *= -1;
                if (e.vy < 0 && e.y <= e.minY) e.vy *= -1;

                if (player.x < e.x + e.w && player.x + player.w > e.x &&
                    player.y < e.y + e.h && player.y + player.h > e.y) {
                    die();
                    return;
                }
            }

            if (boss) {
                boss.x += boss.vx;
                if (boss.x <= boss.minX || boss.x + boss.w >= boss.maxX) boss.vx *= -1;
                bossAttackTimer--;
                if (bossAttackTimer <= 0) {
                    const dx = player.x + player.w / 2 - (boss.x + boss.w / 2);
                    const dy = player.y + player.h / 2 - (boss.y + boss.h / 2);
                    const distance = Math.hypot(dx, dy) || 1;
                    const speed = 4.2 + (boss.maxHp - boss.hp) * 0.35;
                    bossProjectiles.push({
                        x: boss.x + boss.w / 2 - 7, y: boss.y + boss.h / 2 - 7,
                        w: 14, h: 14, vx: dx / distance * speed, vy: dy / distance * speed
                    });
                    bossAttackTimer = Math.max(48, 92 - (boss.maxHp - boss.hp) * 6);
                }
                for (let i = bossProjectiles.length - 1; i >= 0; i--) {
                    const shot = bossProjectiles[i];
                    shot.x += shot.vx;
                    shot.y += shot.vy;
                    if (shot.x < camera.x - 80 || shot.x > camera.x + canvas.width + 80 ||
                        shot.y < camera.y - 80 || shot.y > camera.y + canvas.height + 80) {
                        bossProjectiles.splice(i, 1);
                    }
                }
            }

            if (keys.a || keys.ArrowLeft) player.vx -= 0.9;
            if (keys.d || keys.ArrowRight) player.vx += 0.9;
            player.vx *= player.friction;
            
            if (player.vx > player.speed) player.vx = player.speed;
            if (player.vx < -player.speed) player.vx = -player.speed;

            let wantSquish = keys.s || keys.ArrowDown;
            if (wantSquish) {
                if (!player.isSquishingFlat) {
                    player.isSquishingFlat = true;
                    player.h = 13;
                    player.w = 36;
                    player.y += 13; 
                    stats.flatSquishes++;
                    if (stats.flatSquishes >= 20) unlockAchievement("pancake");
                }
            } else if (player.isSquishingFlat) {
                let testY = player.y - 13;
                if (!checkCollisionAt(player.x, testY, player.baseW, player.baseH)) {
                    player.isSquishingFlat = false;
                    player.w = player.baseW;
                    player.h = player.baseH;
                    player.y = testY;
                }
            }

            if (player.grounded) {
                player.coyoteTimer = 8; 
            } else {
                player.coyoteTimer--;
                player.standingOn = null;
            }

            let jumpRequested = (keys.space && !spaceWasPressed) || ((keys.w || keys.ArrowUp) && !upWasPressed);
            spaceWasPressed = keys.space;
            upWasPressed = keys.w || keys.ArrowUp;

            if (jumpRequested) {
                if (player.grounded || player.coyoteTimer > 0) {
                    player.vy = -player.jumpPower;
                    player.grounded = false;
                    player.standingOn = null;
                    player.coyoteTimer = 0; 
                    player.jumpsLeft = 1;
                } else if (player.jumpsLeft > 0) {
                    player.vy = -player.jumpPower * 0.95;
                    player.jumpsLeft = 0;
                    player.isFlipping = true;
                    player.flipAngle = 0;
                    stats.flips++;
                    if (stats.flips >= 20) unlockAchievement("flip");
                    createJumpBurst(player.x + player.w/2, player.y + player.h/2);
                }
            }

            player.vy += player.gravity;

            let wiggle = 0;
            if (Math.abs(player.vx) > 0.5 && !player.isSquishingFlat && player.grounded) {
                wiggle = Math.sin(Date.now() / 60) * (Math.abs(player.vx) * 0.4); 
            }

            if (player.isSquishingFlat) {
                player.renderW = 38 + Math.abs(player.vx) * 0.5;
                player.renderH = 12;
            } else {
                player.renderW = player.w - (Math.abs(player.vy) * 0.3) + (Math.abs(player.vx) * 0.4) + wiggle;
                player.renderH = player.h + (Math.abs(player.vy) * 0.5) - (Math.abs(player.vx) * 0.2) - wiggle;
            }

            player.blinkTimer--;
            if (player.blinkTimer <= 0) {
                player.isBlinking = true;
                if (player.blinkTimer < -8) {
                    player.isBlinking = false;
                    player.blinkTimer = Math.random() * 150 + 60; 
                }
            }

            player.x += player.vx;
            checkCollisions("x");

            const previousBottom = player.y + player.h;
            player.y += player.vy;
            player.grounded = false;
            checkCollisions("y");

            if (boss) {
                const overlapsBoss = player.x < boss.x + boss.w && player.x + player.w > boss.x &&
                    player.y < boss.y + boss.h && player.y + player.h > boss.y;
                if (overlapsBoss) {
                    if (player.vy >= 0 && previousBottom <= boss.y + 20) {
                        boss.hp--;
                        player.y = boss.y - player.h;
                        player.vy = -player.jumpPower * 0.78;
                        player.grounded = false;
                        createJumpBurst(player.x + player.w / 2, player.y + player.h);
                        if (boss.hp <= 0) {
                            boss = null;
                            bossProjectiles = [];
                            unlockAchievement("master");
                            gameState = "CAMPAIGN_WIN";
                        }
                    } else {
                        die();
                        return;
                    }
                }
                for (let i = bossProjectiles.length - 1; i >= 0; i--) {
                    const shot = bossProjectiles[i];
                    if (player.x < shot.x + shot.w && player.x + player.w > shot.x &&
                        player.y < shot.y + shot.h && player.y + player.h > shot.y) {
                        die();
                        return;
                    }
                }
            }

            if (player.y > 1600 || player.x < -100) die();

            let targetCamX = player.x - canvas.width / 2 + player.w / 2;
            let targetCamY = player.y - canvas.height / 2 + player.h / 2;
            camera.x += (targetCamX - camera.x) * 0.1;
            camera.y += (targetCamY - camera.y) * 0.1;

            if (gameState === "CAMPAIGN" && !boss) {
                if (player.x < goal.x + goal.w && player.x + player.w > goal.x &&
                    player.y < goal.y + goal.h && player.y + player.h > goal.y) {
                    const achievement = levels[currentLevel].completionAchievement;
                    if (achievement) unlockAchievement(achievement);
                    currentLevel++;
                    if (currentLevel >= levels.length) {
                        unlockAchievement("master");
                        gameState = "CAMPAIGN_WIN";
                    } else {
                        loadLevel();
                    }
                }
            }

            if (gameState === "ENDLESS") {
                endlessDistance += endlessSpeed / 10;
                endlessSpeed += 0.0008; 

                if (endlessDistance > 1000) unlockAchievement("runner");

                for (let i = 0; i < platforms.length; i++) platforms[i].x -= endlessSpeed;
                for (let i = energyBits.length - 1; i >= 0; i--) {
                    energyBits[i].x -= endlessSpeed;
                    
                    let eb = energyBits[i];
                    if (player.x < eb.x + eb.w && player.x + player.w > eb.x &&
                        player.y < eb.y + eb.h && player.y + player.h > eb.y) {
                        stats.bitsCollected++;
                        energyBits.splice(i, 1);
                        if (stats.bitsCollected >= 10) unlockAchievement("hoarder");
                    }
                }
                
                if (player.x < 10) player.x = 10;
                if (platforms[0] && platforms[0].x + platforms[0].w < 0) platforms.shift();

                let lastP = platforms[platforms.length - 1];
                if (lastP && lastP.x + lastP.w < 850) {
                    let w = Math.random() * 150 + 100;
                    let h = 20;
                    let gapX = Math.random() * 100 + 70; 
                    let gapY = (Math.random() - 0.5) * 140; 
                    let nextY = lastP.y + gapY;
                    if (nextY < 150) nextY = 150; 
                    if (nextY > 440) nextY = 440;
                    
                    let newP = { x: lastP.x + lastP.w + gapX, y: nextY, w: w, h: h };
                    platforms.push(newP);

                    if (Math.random() > 0.4) {
                        energyBits.push({
                            x: newP.x + newP.w / 2 - 6,
                            y: newP.y - 25,
                            w: 12, h: 12
                        });
                    }
                }
            }
        }

        function checkCollisions(axis) {
            let allP = platforms.concat(movingPlatforms);

            for (let p of allP) {
                if (player.x < p.x + p.w && player.x + player.w > p.x &&
                    player.y < p.y + p.h && player.y + player.h > p.y) {
                    
                    if (axis === "x") {
                        if (player.vx > 0) player.x = p.x - player.w;
                        else if (player.vx < 0) player.x = p.x + p.w;
                        player.vx = 0;
                    } else if (axis === "y") {
                        if (player.vy > 0) { 
                            player.y = p.y - player.h; 
                            player.grounded = true; 
                            player.standingOn = p;
                            player.jumpsLeft = 2;
                            player.isFlipping = false;
                        } else if (player.vy < 0) { 
                            player.y = p.y + p.h; 
                        }
                        player.vy = 0;
                    }
                }
            }
            
            for (let l of lavas) {
                if (player.x < l.x + l.w && player.x + player.w > l.x &&
                    player.y < l.y + l.h && player.y + player.h > l.y) {
                    die(); 
                    return;
                }
            }
        }

        function drawGlitchEnemy(e) {
            ctx.save();
            let jitterX = (Math.random() - 0.5) * 4;
            let jitterY = (Math.random() - 0.5) * 4;
            let ex = e.x + jitterX;
            let ey = e.y + jitterY;

            ctx.fillStyle = "rgba(0, 255, 255, 0.5)";
            ctx.fillRect(ex - 4, ey + 2, e.w, e.h);
            ctx.fillStyle = "rgba(255, 0, 85, 0.5)";
            ctx.fillRect(ex + 4, ey - 2, e.w, e.h);

            let bodyGrad = ctx.createLinearGradient(ex, ey, ex, ey + e.h);
            bodyGrad.addColorStop(0, "#2a0018");
            bodyGrad.addColorStop(1, "#0a010d");
            ctx.fillStyle = bodyGrad;
            ctx.fillRect(ex, ey, e.w, e.h);

            ctx.strokeStyle = "#ff0055";
            ctx.lineWidth = 2;
            ctx.shadowColor = "#ff0055";
            ctx.shadowBlur = 10;
            ctx.strokeRect(ex, ey, e.w, e.h);

            if (Math.random() > 0.25) {
                ctx.fillStyle = Math.random() > 0.5 ? "#00f0ff" : "#ff0055";
                let sliceY = ey + Math.random() * (e.h - 4);
                let sliceH = Math.random() * 4 + 2;
                let sliceOffset = (Math.random() - 0.5) * 12;
                ctx.fillRect(ex + sliceOffset, sliceY, e.w, sliceH);
            }

            ctx.fillStyle = "rgba(255, 0, 85, 0.2)";
            let scanY = (Date.now() / 15) % e.h;
            ctx.fillRect(ex, ey + scanY, e.w, 3);

            ctx.fillStyle = "#ff0055";
            ctx.shadowColor = "#ff0055";
            ctx.shadowBlur = 8;
            
            ctx.beginPath();
            ctx.moveTo(ex + 4, ey + 7);
            ctx.lineTo(ex + e.w - 4, ey + 7);
            ctx.lineTo(ex + e.w - 7, ey + 13);
            ctx.lineTo(ex + 7, ey + 13);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            let eyeOffset = Math.sin(Date.now() / 60) * 2;
            ctx.fillRect(ex + 7 + eyeOffset, ey + 9, 3, 3);
            ctx.fillRect(ex + e.w - 10 + eyeOffset, ey + 9, 3, 3);

            ctx.fillStyle = "#00f0ff";
            ctx.shadowColor = "#00f0ff";
            ctx.shadowBlur = 6;
            let floatOffset = Math.sin(Date.now() / 120) * 3;
            ctx.fillRect(ex - 3, ey - 3 + floatOffset, 4, 4);
            ctx.fillRect(ex + e.w - 1, ey - 3 - floatOffset, 4, 4);

            ctx.restore();
        }

        function drawWarden() {
            if (!boss) return;
            ctx.save();
            const pulse = Math.sin(Date.now() / 110) * 5;
            const x = boss.x;
            const y = boss.y + pulse;
            ctx.shadowColor = "#ff0055";
            ctx.shadowBlur = 24;
            const gradient = ctx.createLinearGradient(x, y, x, y + boss.h);
            gradient.addColorStop(0, "#ff3b87");
            gradient.addColorStop(0.55, "#8f0048");
            gradient.addColorStop(1, "#210027");
            ctx.fillStyle = gradient;
            ctx.fillRect(x, y, boss.w, boss.h);
            ctx.strokeStyle = "#ff0055";
            ctx.lineWidth = 4;
            ctx.strokeRect(x, y, boss.w, boss.h);
            ctx.shadowColor = "#00f0ff";
            ctx.shadowBlur = 14;
            ctx.fillStyle = "#00f0ff";
            ctx.fillRect(x + 17, y + 27, 18, 9);
            ctx.fillRect(x + boss.w - 35, y + 27, 18, 9);
            ctx.fillStyle = "#fff";
            ctx.fillRect(x + 23, y + 29, 5, 5);
            ctx.fillRect(x + boss.w - 29, y + 29, 5, 5);
            ctx.fillStyle = "#ff00ff";
            ctx.fillRect(x + 37, y + 57, 18, 8);
            ctx.restore();
        }

        function drawMovingPlatform(mp) {
            ctx.save();

            let platGrad = ctx.createLinearGradient(mp.x, mp.y, mp.x, mp.y + mp.h);
            platGrad.addColorStop(0, "#ffe600");
            platGrad.addColorStop(0.3, "#ffaa00");
            platGrad.addColorStop(1, "#773a00");

            ctx.fillStyle = platGrad;
            ctx.fillRect(mp.x, mp.y, mp.w, mp.h);

            ctx.strokeStyle = "#ffe600";
            ctx.lineWidth = 2;
            ctx.shadowColor = "#ffaa00";
            ctx.shadowBlur = 12;
            ctx.strokeRect(mp.x, mp.y, mp.w, mp.h);

            ctx.fillStyle = "#ffffff";
            ctx.shadowBlur = 6;
            ctx.fillRect(mp.x, mp.y, 4, mp.h);
            ctx.fillRect(mp.x + mp.w - 4, mp.y, 4, mp.h);

            ctx.shadowBlur = 0;
            ctx.strokeStyle = "rgba(0, 0, 0, 0.45)";
            ctx.lineWidth = 2;
            
            let arrowOffset = (Date.now() / 30) % 16;
            let isMovingLeft = mp.vx < 0 || mp.vy < 0;

            for (let cx = mp.x + 8; cx < mp.x + mp.w - 8; cx += 16) {
                let drawX = isMovingLeft ? cx - arrowOffset : cx + arrowOffset;
                if (drawX >= mp.x + 6 && drawX <= mp.x + mp.w - 12) {
                    ctx.beginPath();
                    let dir = isMovingLeft ? -1 : 1;
                    ctx.moveTo(drawX, mp.y + 4);
                    ctx.lineTo(drawX + (4 * dir), mp.y + mp.h / 2);
                    ctx.lineTo(drawX, mp.y + mp.h - 4);
                    ctx.stroke();
                }
            }

            ctx.fillStyle = "#ffffff";
            ctx.shadowColor = "#ffffff";
            ctx.shadowBlur = 4;
            ctx.fillRect(mp.x + 4, mp.y, mp.w - 8, 2);

            ctx.restore();
        }

        function drawSquishyBob() {
            ctx.save();
            let centerX = player.x + player.w / 2;
            let centerY = player.y + player.h / 2;
            ctx.translate(centerX, centerY);

            if (player.isFlipping) {
                player.flipAngle += 0.32;
                if (player.flipAngle >= Math.PI * 2) {
                    player.flipAngle = 0;
                    player.isFlipping = false;
                }
                ctx.rotate(player.flipAngle);
            }

            let rx = player.renderW / 2;
            let ry = player.renderH / 2;

            ctx.shadowColor = "#00f0ff";
            ctx.shadowBlur = 22;

            let bodyGrad = ctx.createLinearGradient(-rx, -ry, rx, ry);
            bodyGrad.addColorStop(0, "#70ffff");
            bodyGrad.addColorStop(0.5, "#00f0ff");
            bodyGrad.addColorStop(1, "#0077ff");

            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.roundRect(-rx, -ry, player.renderW, player.renderH, [Math.min(rx, ry) * 0.85]);
            ctx.fill();

            let corePulse = Math.sin(Date.now() / 150) * 1.5;
            ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
            ctx.shadowColor = "#ffffff";
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(0, ry * 0.2, Math.max(1, Math.min(rx, ry) * 0.22 + corePulse), 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.ellipse(-rx * 0.35, -ry * 0.4, rx * 0.35, ry * 0.2, -0.2, 0, Math.PI * 2);
            ctx.fill();

            if (!player.isFlipping) {
                let lookX = (player.vx / player.speed) * 3;
                let lookY = (player.vy / player.jumpPower) * 2;
                let eyeOffset = rx * 0.38;
                let eyeY = -ry * 0.15 + lookY;

                ctx.strokeStyle = "#030814";
                ctx.fillStyle = "#030814";
                ctx.lineWidth = 2.5;

                if (player.isSquishingFlat || player.isBlinking) {
                    ctx.beginPath();
                    ctx.moveTo(-eyeOffset + lookX - 4, eyeY);
                    ctx.lineTo(-eyeOffset + lookX + 4, eyeY);
                    ctx.moveTo(eyeOffset + lookX - 4, eyeY);
                    ctx.lineTo(eyeOffset + lookX + 4, eyeY);
                    ctx.stroke();
                } else if (player.vy < -3) {
                    ctx.beginPath();
                    ctx.arc(-eyeOffset + lookX, eyeY - 2, 4.5, 0, Math.PI * 2);
                    ctx.arc(eyeOffset + lookX, eyeY - 2, 4.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#00f0ff";
                    ctx.beginPath();
                    ctx.arc(-eyeOffset + lookX + 1, eyeY - 3, 1.8, 0, Math.PI * 2);
                    ctx.arc(eyeOffset + lookX + 1, eyeY - 3, 1.8, 0, Math.PI * 2);
                    ctx.fill();
                } else if (player.vy > 4) {
                    ctx.beginPath();
                    ctx.arc(-eyeOffset + lookX, eyeY, 3.5, Math.PI, 0);
                    ctx.arc(eyeOffset + lookX, eyeY, 3.5, Math.PI, 0);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(-eyeOffset + lookX, eyeY, 3.5, 0, Math.PI * 2);
                    ctx.arc(eyeOffset + lookX, eyeY, 3.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(-eyeOffset + lookX - 1, eyeY - 1, 1.2, 0, Math.PI * 2);
                    ctx.arc(-eyeOffset + lookX - 1, eyeY - 1, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === "INTRO") {
                ctx.fillStyle = "#03030b";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let scanY = (introTimer * 8) % canvas.height;
                ctx.strokeStyle = "rgba(0, 255, 255, 0.25)";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, scanY);
                ctx.lineTo(canvas.width, scanY);
                ctx.stroke();

                ctx.strokeStyle = "rgba(255, 0, 255, 0.08)";
                ctx.lineWidth = 1;
                for (let x = 0; x < canvas.width; x += 30) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }

                ctx.fillStyle = "#00f0ff";
                ctx.font = "bold 18px 'Courier New', monospace";
                ctx.textAlign = "left";
                for (let i = 0; i <= introTextIndex; i++) {
                    ctx.fillText(introMessages[i], 100, 150 + (i * 42));
                }

                let progress = Math.min(1, introTimer / introMaxTimer);
                ctx.strokeStyle = "#ff00ff";
                ctx.lineWidth = 2;
                ctx.strokeRect(100, 350, 600, 26);
                
                ctx.fillStyle = "#ff00ff";
                ctx.shadowColor = "#ff00ff";
                ctx.shadowBlur = 12;
                ctx.fillRect(104, 354, 592 * progress, 18);
                ctx.shadowBlur = 0;

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 14px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.fillText(`SYSTEM BOOT SEQUENCE: ${Math.floor(progress * 100)}%`, 400, 410);
                return;
            }

            if (gameState === "ACHIEVEMENTS") {
                ctx.fillStyle = "#0ff"; 
                ctx.textAlign = "center";
                ctx.font = "bold 30px 'Courier New', monospace"; 
                ctx.shadowColor = "#0ff"; ctx.shadowBlur = 10;
                ctx.fillText("BOB'S TROPHY CABINET", 400, 55);
                ctx.shadowBlur = 0;

                ctx.font = "14px 'Courier New', monospace";
                let startY = 100;
                achievements.forEach((a, i) => {
                    let col = i % 2 === 0 ? 260 : 540;
                    let row = Math.floor(i / 2);
                    ctx.textAlign = "center";
                    ctx.fillStyle = a.unlocked ? "#ff00ff" : "#444";
                    let prefix = a.unlocked ? "▶ " : "🔒 ";
                    ctx.fillText(prefix + a.name, col, startY + (row * 52));
                    ctx.fillStyle = a.unlocked ? "#fff" : "#666";
                    ctx.fillText(a.desc, col, startY + 18 + (row * 52));
                });
                
                ctx.fillStyle = "#0ff";
                ctx.fillText(`Deaths: ${stats.deaths} | Best Endless: ${Math.floor(stats.highEndless)}m | Energy Bytes: ${stats.bitsCollected}`, 400, 420);
                ctx.fillStyle = "#ff00ff";
                ctx.fillText("Press SPACE or [M] to Return to Menu", 400, 460);
                return;
            }

            ctx.save();
            if (gameState === "CAMPAIGN") {
                ctx.translate(-Math.floor(camera.x), -Math.floor(camera.y));
            }

            ctx.strokeStyle = "rgba(0, 255, 255, 0.05)";
            ctx.lineWidth = 1;
            for (let x = -500; x < 2500; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, -500); ctx.lineTo(x, 2000); ctx.stroke();
            }
            for (let y = -500; y < 2000; y += 40) {
                ctx.beginPath(); ctx.moveTo(-500, y); ctx.lineTo(2500, y); ctx.stroke();
            }

            for (let p of platforms) {
                ctx.fillStyle = "#111a2e"; 
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = "#00e5ff"; 
                ctx.lineWidth = 2;
                ctx.shadowColor = "#00e5ff"; 
                ctx.shadowBlur = 8;
                ctx.strokeRect(p.x, p.y, p.w, p.h);
                ctx.shadowBlur = 0;
            }

            for (let mp of movingPlatforms) {
                drawMovingPlatform(mp);
            }

            let offset = Math.sin(Date.now() / 150) * 3;
            for (let l of lavas) {
                ctx.fillStyle = "#ff0055";
                ctx.shadowColor = "#ff0055";
                ctx.shadowBlur = 12;
                ctx.fillRect(l.x, l.y + offset, l.w, l.h - offset);
                ctx.shadowBlur = 0;
            }

            for (let e of enemies) {
                drawGlitchEnemy(e);
            }

            drawWarden();
            for (const shot of bossProjectiles) {
                ctx.fillStyle = "#ff0055";
                ctx.shadowColor = "#ff0055";
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(shot.x + shot.w / 2, shot.y + shot.h / 2, shot.w / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            for (let eb of energyBits) {
                ctx.fillStyle = "#ffe600";
                ctx.shadowColor = "#ffe600";
                ctx.shadowBlur = 10;
                ctx.fillRect(eb.x, eb.y, eb.w, eb.h);
                ctx.shadowBlur = 0;
            }

            if (gameState === "CAMPAIGN" && !boss) {
                ctx.fillStyle = "#ff00ff"; 
                ctx.shadowColor = "#ff00ff"; 
                ctx.shadowBlur = 15;
                ctx.fillRect(goal.x, goal.y, goal.w, goal.h); 
                ctx.shadowBlur = 0;
            }

            if (gameState === "CAMPAIGN" || gameState === "ENDLESS") {
                drawSquishyBob();
            }

            for (let pt of particles) {
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = Math.max(0, pt.alpha);
                ctx.shadowColor = pt.color;
                ctx.shadowBlur = 6;
                ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1.0;
            }

            ctx.restore();

            if (gameState === "CAMPAIGN") {
                ctx.fillStyle = "rgba(0, 255, 255, 0.85)"; 
                ctx.textAlign = "center";
                ctx.font = "bold 21px 'Courier New', monospace";
                ctx.fillText(levels[currentLevel].t, 400, 40);
                ctx.font = "13px 'Courier New', monospace";
                ctx.fillText(levels[currentLevel].m, 400, 68);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffe600";
                ctx.font = "bold 13px 'Courier New', monospace";
                ctx.fillText(`SECTOR ${String(currentLevel + 1).padStart(2, "0")} / 30`, 780, 96);
                if (boss) {
                    ctx.textAlign = "center";
                    ctx.fillStyle = "rgba(10, 0, 20, 0.9)";
                    ctx.fillRect(230, 107, 340, 20);
                    ctx.fillStyle = "#ff0055";
                    ctx.shadowColor = "#ff0055";
                    ctx.shadowBlur = 12;
                    ctx.fillRect(234, 111, 332 * (boss.hp / boss.maxHp), 12);
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = "#ff8cce";
                    ctx.strokeRect(230, 107, 340, 20);
                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 12px 'Courier New', monospace";
                    ctx.fillText(`WARDEN CORE: ${boss.hp} / ${boss.maxHp}`, 400, 143);
                }
            } else if (gameState === "ENDLESS") {
                ctx.fillStyle = "rgba(255, 0, 255, 0.85)"; 
                ctx.textAlign = "center";
                ctx.font = "bold 32px 'Courier New', monospace"; 
                ctx.fillText(Math.floor(endlessDistance) + "m", 400, 50);
                ctx.font = "14px 'Courier New', monospace";
                ctx.fillStyle = "#ffe600";
                ctx.fillText("BYTES: " + stats.bitsCollected, 400, 78);
            }

            if (gameState === "CAMPAIGN_WIN" || gameState === "ENDLESS_OVER") {
                ctx.fillStyle = "rgba(5, 5, 16, 0.88)"; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = "center"; 
                
                if (gameState === "CAMPAIGN_WIN") {
                    ctx.fillStyle = "#0ff";
                    ctx.shadowColor = "#0ff"; ctx.shadowBlur = 15;
                    ctx.font = "bold 36px 'Courier New', monospace";
                    ctx.fillText("THE NEON GRID IS FREE!", 400, 210);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "#fff"; 
                    ctx.font = "18px 'Courier New', monospace";
                    ctx.fillText("Bob rebooted all 30 sectors and freed the trapped crew!", 400, 260);
                } else {
                    ctx.fillStyle = "#ff0055";
                    ctx.shadowColor = "#ff0055"; ctx.shadowBlur = 15;
                    ctx.font = "bold 40px 'Courier New', monospace";
                    ctx.fillText("SYSTEM CRASH!", 400, 190);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = "#fff"; 
                    ctx.font = "18px 'Courier New', monospace";
                    ctx.fillText(`Distance Survived: ${Math.floor(endlessDistance)}m`, 400, 240);
                    ctx.fillText(`Energy Bytes Collected: ${stats.bitsCollected}`, 400, 275);
                }
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#ff00ff"; 
                ctx.font = "18px 'Courier New', monospace";
                ctx.fillText("Press SPACE to Return to Menu", 400, 340);
            }

            toasts.forEach((t) => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, t.alpha));
                
                let toastX = 400 - 170;
                let toastY = 20 + t.animY;

                ctx.fillStyle = "rgba(10, 10, 22, 0.95)";
                ctx.strokeStyle = "#ff00ff";
                ctx.lineWidth = 2;
                ctx.shadowColor = "#ff00ff";
                ctx.shadowBlur = 10;
                
                ctx.fillRect(toastX, toastY, 340, 40);
                ctx.strokeRect(toastX, toastY, 340, 40);
                
                ctx.fillStyle = "#ff00ff"; 
                ctx.font = "bold 14px 'Courier New', monospace"; 
                ctx.textAlign = "center";
                ctx.shadowBlur = 0;
                ctx.fillText(t.text, 400, toastY + 25);
                ctx.restore();
            });
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
